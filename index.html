<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SalonBook</title>
    <meta name="description" content="SalonBook — India's salon booking platform. Discover top-rated salons, check live slots, and book hair, beauty &amp; wellness services instantly." />
    <meta property="og:title" content="SalonBook — Book beauty &amp; wellness near you" />
    <meta property="og:description" content="Discover top-rated salons, check real-time slots, and book hair, beauty, and wellness services in seconds. Pay at the shop." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalonBook" />
    <meta name="twitter:description" content="India's salon booking platform. Book beauty &amp; wellness services near you." />
    <script>
      (function () {
        var key = 'salonbook:entry-reload';
        window.addEventListener('error', function (ev) {
          var t = ev.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var url = t.src || t.href || '';
          if (url.indexOf('/assets/') === -1) return;
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, '1');
          location.reload();
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
